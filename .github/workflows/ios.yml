name: iOS KMP CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Compile Kotlin/Native iOS simulator library
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-36"

      - name: Compile iOS Simulator arm64 core library
        run: ./gradlew :kbox2d:compileKotlinIosSimulatorArm64 --no-configuration-cache
